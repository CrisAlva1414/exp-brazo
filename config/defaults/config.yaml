version: 1
camera:
  index: 0
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG
perception:
  engine: mediapipe_tasks
  max_hands: 2
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  person_selection: largest_pose
  pose_model_complexity: 1
  hand_model_complexity: 0
  process_max_width: 640
  detection_fps: 15
  gestures:
    HOLA:
      enabled: true
      min_confidence: 0.7
      hold_ms: 300
      cooldown_s: 2.5
      window_ms: 3000
      min_direction_changes: 3
      min_amplitude_ratio: 0.15
      min_step_ratio: 0.012
      dominance_ratio: 1.5
      smoothing_alpha: 0.6
      min_samples: 7
      require_raised: true
      min_visibility: 0.6
    SI:
      enabled: true
      min_confidence: 0.5
      hold_ms: 250
      cooldown_s: 2.0
      window_ms: 2500
      min_direction_changes: 4
      min_amplitude_ratio: 0.06
      min_step_ratio: 0.02
      dominance_ratio: 2.0
      smoothing_alpha: 0.6
      min_samples: 7
      min_visibility: 0.6
      require_raised: false
    'NO':
      enabled: true
      min_confidence: 0.7
      hold_ms: 250
      cooldown_s: 2.0
      window_ms: 3000
      min_direction_changes: 3
      min_amplitude_ratio: 0.12
      min_step_ratio: 0.012
      dominance_ratio: 2.0
      smoothing_alpha: 0.6
      min_samples: 7
      min_visibility: 0.6
    SEIS_SIETE:
      enabled: true
      min_confidence: 0.75
      hold_ms: 400
      cooldown_s: 3.0
      window_ms: 4000
      min_cycles: 3
      min_correlation: 0.55
      min_step_ratio: 0.008
      dominance_ratio: 1.3
      smoothing_alpha: 0.6
      min_samples: 10
      require_raised: true
      require_two_hands: true
      min_visibility: 0.6
  global_cooldown_s: 0.8
decision:
  anti_repetition: true
  busy_policy: drop
robot:
  adapter: mock
  ip: 192.168.5.1
  dashboard_port: 29999
  move_port: 30003
  feedback_port: 30004
  connect_timeout_s: 3.0
  max_speed_pct: 30
  max_accel_pct: 30
  dedupe_ttl_s: 300.0
  joint_limits:
    J1:
    - -180
    - 180
    J2:
    - -180
    - 180
    J3:
    - -160
    - 160
    J4:
    - -180
    - 180
    J5:
    - -180
    - 180
    J6:
    - -180
    - 180
  home_joints:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
dashboard:
  host: 127.0.0.1
  port: 8000
  log_max_entries: 2000
supervisor:
  heartbeat_timeout_s: 5.0
  restart_backoff_s:
  - 1
  - 2
  - 4
  - 8
  - 15
  ambient_interval_s: 20.0
